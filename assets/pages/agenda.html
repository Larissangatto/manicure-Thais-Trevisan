<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/agenda.js" defer></script>
</head>

<body id="body-agenda">
    <div class="menu">
        <a class="back-home" href="../../index.html"> ← </a>
        <div class="menu-name">
            <h1 class="title-name">Thais Trevisan</h1>
            <h2 class="sub-title">Manicure e pedicure</h2>
        </div>
    </div>

<section id="agenda">
    <div class="card-header">
        <h1>Agende seu Horário</h1>
        <p>Escolha o serviço, a data e o melhor horário para você.</p>
    </div>

    <form class="agenda-form">
       
        <div class="campo">
            <label for="servico">
                <span class="step-badge">1</span> Escolha o serviço
            </label>
            <div class="select-wrapper">
                <select id="servico">
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="manicure">💅🏻 Manicure</option>
                    <option value="pedicure">🦶🏻 Pedicure</option>
                    <option value="mao-pe">🖐🏻🦶🏻 Mão e Pé (Completo)</option>
                </select>
            </div>
        </div>

       
        <div class="campo">
            <label for="data">
                <span class="step-badge">2</span> Escolha o dia
            </label>
            <input type="date" id="data">
            <p id="data-escolhida"></p>
        </div>

      
        <div class="campo">
            <label>
                <span class="step-badge">3</span> Selecione o horário:
            </label>
            <div id="aviso">
                <div id="mensagem-instrucao" class="temporario">Os horários disponíveis irão aparecer após selecionar o serviço e a data.</div>
            </div>
            <ul class="horarios" id="horarios">
                <!-- <li><button type="button">09:00</button></li>
                <li><button type="button">10:00</button></li>
                <li><button type="button">11:00</button></li>
                <li><button type="button">12:00</button></li>
                <li><button type="button">15:00</button></li>
                <li><button type="button">17:00</button></li>
                <li><button type="button">19:00</button></li> -->
            </ul>
        </div>

        <div id="checagem"></div>
        <button id="agendamento" type="button" disabled>
            Confirmar Agendamento
        </button>
    </form>
</section>


</body>
</html>
