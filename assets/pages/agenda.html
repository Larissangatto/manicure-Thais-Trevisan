<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body id="body-agenda">
    <div class="menu">
        <a class="back-home" href="../../index.html"> ← </a>
        <div class="menu-name">
            <h1 class="title-name">Thais Trevisan</h1>
            <h2 class="sub-title">Manicure e pedicure</h2>
        </div>
    </div>
<section id="agenda">
    <div class="title">
        <h1>Horários disponíveis</h1>
    </div>


    <div class="campo">

        <label class="font" for="servico">Escolha um serviço:</label>

        <select id="servico">
            <option value="manicure">Manicure 💅🏻</option>
            <option value="pedicure">Pedicure 🦶🏻</option>
            <option value="mao-pe">Mão e pé 🖐🏻🦶🏻</option>
        </select>

    </div>

    <div class="campo">

        <label class="font" for="data">Escolha o dia:</label>

        <input type="date" id="data">
        <p id="data-escolhida"></p>

    </div>

    <h2 class="font">Selecione o horário:</h2>

    <ul class="horarios" id="horarios">

        <li><button>09:00</button></li>
        <li><button>10:00</button></li>
        <li><button>11:00</button></li>
        <li><button>12:00</button></li>
        <li><button>15:00</button></li>
        <li><button>17:00</button></li>
        <li><button>19:00</button></li>


    </ul>
    <button id="agendamento" type="button" disabled>
        Agendar horário
    </button>

</section>

<script src="../js/agenda.js"></script>

</body>
</html>
